# limine.conf -- see https://github.com/Limine-Bootloader/Limine/blob/trunk/CONFIG.md
#
# Two entries booting the exact same kernel ELF two different ways --
# see src/limine.rs and src/boot_multiboot2.s for how the kernel tells
# them apart at runtime. Picking the Multiboot2 entry is also a good
# way to sanity-check the kernel under GRUB or `qemu-system-x86_64
# -kernel`, independent of Limine itself.

timeout: 3

/mitosOS (Limine protocol)
    protocol: limine
    path: boot():/boot/mitosos.elf
    module_path: boot():/boot/rootfs.tar

/mitosOS (Multiboot2)
    protocol: multiboot2
    path: boot():/boot/mitosos.elf
    module_path: boot():/boot/rootfs.tar

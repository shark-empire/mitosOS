# Configuration for x86_64 (custom bootloader — see /bootloader)
[build]
target = "x86_64-unknown-none.json"

[unstable]
build-std = ["core", "alloc"]
# Remove "compiler-builtins-mem" from build-std-features:
build-std-features = []


[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tlinker_x86.ld",
    "-C", "relocation-model=static",
    "-C", "code-model=large",
    "-C", "link-arg=-nostartfiles",
    "-C", "target-feature=-sse,-sse2", # <--- ADD THIS
]

# Configuration for Raspberry Pi (AArch64)
[target.aarch64-unknown-none]
rustflags = ["-C", "link-arg=-Tlinker_rpi.ld"]

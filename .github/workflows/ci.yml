name: kernel-boot-test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-none
            qemu_bin: qemu-system-aarch64
            qemu_flags: -M raspi3b -display none -serial stdio
            bin_name: kernel8.img

          - target: x86_64-unknown-none
            qemu_bin: qemu-system-x86_64
            # Boots disk.img via SeaBIOS — exercises the real
            # stage1 -> stage2 -> kernel handoff, not a shortcut load.
            qemu_flags: -M pc -m 256M -no-reboot -display none -serial stdio

            bin_name: mitosos

  
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-system-x86 gcc-aarch64-linux-gnu nasm

      - name: Setup Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none, aarch64-unknown-none
          components: llvm-tools-preview

      - name: Create ramdisk (ARM only)
        if: matrix.target == 'aarch64-unknown-none'
        run: |
          mkdir -p rootfs/bin
          echo "Hello from mitosOS in-memory filesystem!" > rootfs/test.txt
          aarch64-linux-gnu-as -o test_program_aarch64.o userspace/test_program_aarch64.s
          # -Ttext places _start at memory::USER_SPACE_BASE (0x8000000000)
          # + 0x10000, matching build.sh's x86_64 link step -- elf.rs
          # refuses to load anything below USER_SPACE_BASE now.
          aarch64-linux-gnu-ld -e _start -Ttext=0x8000010000 -o rootfs/bin/test_program test_program_aarch64.o
          rm -f test_program_aarch64.o
          tar -cf rootfs.tar -C rootfs bin/test_program test.txt

      - name: Build kernel (ARM only)
        if: matrix.target == 'aarch64-unknown-none'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare boot image (ARM only)
        if: matrix.target == 'aarch64-unknown-none'
        run: |
          TOOLCHAIN_BIN=$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | grep host | cut -f2 -d' ')/bin
          export PATH=$PATH:$TOOLCHAIN_BIN
          rust-objcopy --strip-all -O binary target/${{ matrix.target }}/release/mitosos ${{ matrix.bin_name }}

      - name: Build bootloader + kernel + disk image (x86_64 only)
        if: matrix.target == 'x86_64-unknown-none'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Boot in QEMU and check serial output
        run: |
          set -o pipefail
          if [ "${{ matrix.target }}" = "aarch64-unknown-none" ]; then
            BOOT_ARGS="-kernel kernel8.img"
          else
            # 1. Mounts disk.img on IDE for the bootloader
            # 2. Injects an empty AHCI controller for the PCI scanner to find
            BOOT_ARGS="-drive format=raw,file=disk.img,if=ide -device ahci,id=ahci0"
          fi

          # Exercises the shell -> VFS -> ELF loader -> ring-3/EL0 spawn
          # path end to end on both architectures now, not just the boot
          # sequence. test_program(_aarch64).s executes one instruction
          # that's illegal at ring-3/EL0 -- hlt on x86_64 (ring-0-only),
          # an EL1-only `mrs` on aarch64 (inaccessible from EL0 in either
          # direction) -- so hitting the resulting fault is the actual
          # proof the process ran unprivileged, not a failure.
          INPUT_CMD="run /bin/test_program"

          # AArch64 needs more wall-clock time before the shell prompt
          # than x86_64 does now: mmu.rs builds a 32MiB identity map
          # page-by-page at boot (thousands of individual 4-level walks
          # plus barrier instructions), which x86_64 never has to do --
          # its bootloader already hands kmain a working, MMU-enabled
          # CR3. Under QEMU's software emulation that shows up as real
          # wall-clock delay, not just instruction count. A 6s head
          # start (tuned back when AArch64 booted almost instantly) was
          # landing the typed command before the shell was actually
          # reading -- no crash, just an unrun command and two failed
          # greps. If this ever needs to grow further, mmu.rs's own
          # boot-time prints (grep qemu_output.log for "MMU enabled")
          # pinpoint how much of the delay is the identity map specifically.
          if [ "${{ matrix.target }}" = "aarch64-unknown-none" ]; then
            PRE_SLEEP=15
            POST_SLEEP=10
            TIMEOUT=45s
          else
            PRE_SLEEP=6
            POST_SLEEP=6
            TIMEOUT=30s
          fi

          # -serial stdio maps the guest UART straight to QEMU's own
          # stdin/stdout. Sleep first so the typed command doesn't land
          # before the kernel's actually reached the shell prompt (the
          # UART RX ring buffer would hold it either way, but this keeps
          # the captured log readable); sleep after so there's time for
          # the spawn, the fault, and the panic diagnostic to print
          # before QEMU gets killed.
          (sleep "$PRE_SLEEP"; printf '%s\n' "$INPUT_CMD"; sleep "$POST_SLEEP") | \
            timeout "$TIMEOUT" ${{ matrix.qemu_bin }} ${{ matrix.qemu_flags }} $BOOT_ARGS 2>&1 | tee qemu_output.log || true

          echo "----- captured serial output -----"
          cat qemu_output.log
          grep -q "mitosOS: kernel_main reached. Boot OK." qemu_output.log

          echo "----- checking ring-3/EL0 process spawn -----"
          grep -q "Spawned as a new isolated (ring-3) process" qemu_output.log
          if [ "${{ matrix.target }}" = "aarch64-unknown-none" ]; then
            grep -q "Trapped MSR/MRS/System instruction" qemu_output.log
          else
            grep -q "General Protection Fault" qemu_output.log
          fi

name: kernel-boot-test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-none
            qemu_bin: qemu-system-aarch64
            qemu_flags: -M raspi3b -display none -serial stdio
            bin_name: kernel8.img

          - target: x86_64-unknown-none
            qemu_bin: qemu-system-x86_64
            qemu_flags: -M pc -m 256M -no-reboot -display none -serial stdio -d int,cpu_reset
            bin_name: mitosos

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-system-x86 gcc-aarch64-linux-gnu nasm expect

      - name: Setup Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: |
            x86_64-unknown-none
            aarch64-unknown-none
          components: llvm-tools-preview

      # [NEW] Expose rust-objcopy globally so build.sh can use it
      - name: Add llvm-tools to GITHUB_PATH
        run: |
          TOOLCHAIN_BIN=$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | grep host | cut -f2 -d' ')/bin
          echo "$TOOLCHAIN_BIN" >> $GITHUB_PATH

      - name: Create ramdisk (ARM only)
        if: matrix.target == 'aarch64-unknown-none'
        run: |
          mkdir -p rootfs/bin
          echo "Hello from mitosOS in-memory filesystem!" > rootfs/test.txt
          aarch64-linux-gnu-as -o test_program_aarch64.o userspace/test_program_aarch64.s
          aarch64-linux-gnu-ld -e _start -Ttext=0x8000010000 -o rootfs/bin/test_program test_program_aarch64.o
          rm -f test_program_aarch64.o
          tar -cf rootfs.tar -C rootfs bin/test_program test.txt

      - name: Build kernel (ARM only)
        if: matrix.target == 'aarch64-unknown-none'
        run: cargo build --release --target ${{ matrix.target }}

      # [NEW] Simplified because rust-objcopy is now in the global PATH
      - name: Prepare boot image (ARM only)
        if: matrix.target == 'aarch64-unknown-none'
        run: rust-objcopy --strip-all -O binary target/${{ matrix.target }}/release/mitosos ${{ matrix.bin_name }}

      - name: Build bootloader + kernel + disk image (x86_64 only)
        if: matrix.target == 'x86_64-unknown-none'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Boot in QEMU and check serial output
        run: |
          set -o pipefail
          
          if [ "${{ matrix.target }}" = "aarch64-unknown-none" ]; then
            BOOT_ARGS="-kernel kernel8.img"
            TIMEOUT_SEC=180
          else
            BOOT_ARGS="-device ahci,id=ahci0 -drive id=os_disk,file=disk.img,format=raw,if=none -device ide-hd,drive=os_disk,bus=ahci0.0,bootindex=1"
            TIMEOUT_SEC=45
          fi

          ISOLATION_MSG="Terminating isolated task..."
          QEMU_CMD="${{ matrix.qemu_bin }} ${{ matrix.qemu_flags }} $BOOT_ARGS"
          INPUT_CMD="run /bin/test_program"

          cat << 'EOF' > run_test.exp
          # Without this, tclsh fully buffers stdout once it's a pipe
          # (as it is here, feeding `tee`) instead of a terminal. The
          # kernel's earliest boot checkpoints are single raw characters
          # with no trailing newline (`out 0x3f8, al`, no polling) --
          # exactly the case a buffer never flushes until it fills or
          # the process exits. `expect`'s own pattern matching against
          # the live QEMU output is unaffected either way (it reads the
          # spawned process directly), but a hang before that buffer
          # fills means qemu_output.log -- and this log -- can look
          # silent even when the kernel already printed several
          # checkpoints past that point. Costs a little throughput;
          # worth it for logs that mean what they show.
          fconfigure stdout -buffering none
          set timeout $env(TIMEOUT_SEC)
          spawn sh -c "$env(QEMU_CMD)"
          
          expect {
              "mitosOS: kernel_main reached. Boot OK." { 
                  puts "\n> CI: Boot confirmed! Waiting 2 seconds for shell..."
                  sleep 2
              }
              eof {
                  puts "\n> CI: Error: QEMU exited unexpectedly (likely a triple fault)!"
                  exit 1
              }
              timeout {
                  puts "\n> CI: Error: Timed out waiting for kernel to boot."
                  exit 1
              }
          }
          
          set send_slow {1 .05}
          send -s "$env(INPUT_CMD)\r"

          # `run` spawns the isolated process and returns immediately --
          # the shell prints its next "mitosOS>" prompt right away, before
          # the scheduler has even given the new task a timeslice to fault
          # in. So the prompt can legitimately arrive *before*
          # ISOLATION_MSG in the stream, not just after it. Waiting for
          # them with two sequential `expect` blocks assumed a strict
          # order that doesn't hold and failed the job even when the
          # kernel behaved correctly. Watching for both patterns in one
          # block (via exp_continue, until both have been seen) accepts
          # either order and still fails on a real hang, since a real
          # hang means one of the two never shows up before timeout.
          set got_isolation 0
          set got_prompt 0

          expect {
              "$env(ISOLATION_MSG)" {
                  set got_isolation 1
                  puts "\n> CI: User-mode fault successfully isolated."
                  if {!$got_prompt} { exp_continue }
              }
              "mitosOS>" {
                  set got_prompt 1
                  puts "\n> CI: Shell prompt seen."
                  if {!$got_isolation} { exp_continue }
              }
              eof {
                  puts "\n> CI: Error: QEMU crashed or exited unexpectedly!"
                  exit 1
              }
              timeout {
                  if {!$got_isolation} {
                      puts "\n> CI: Error: Timed out waiting for task termination message."
                  } else {
                      puts "\n> CI: Error: Shell did not return after fault. OS likely hung."
                  }
                  exit 1
              }
          }

          puts "\n> CI: Shell survived the fault! Test passed."
          sleep 1
          exit 0
          EOF

          export QEMU_CMD
          export TIMEOUT_SEC
          export INPUT_CMD
          export ISOLATION_MSG

          expect run_test.exp 2>&1 | tee qemu_output.log || true

          echo "----- captured serial output -----"
          cat qemu_output.log
          
          grep -q "mitosOS: kernel_main reached. Boot OK." qemu_output.log
          grep -q "$ISOLATION_MSG" qemu_output.log
          grep -q "mitosOS>" qemu_output.log

name: kernel-boot-test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-none
            qemu_bin: qemu-system-aarch64
            qemu_flags: -M raspi3b -display none -serial stdio
            bin_name: kernel8.img

          - target: x86_64-unknown-none
            qemu_bin: qemu-system-x86_64
            # -boot order=d pins the CD-ROM as the boot device explicitly,
            # instead of relying on QEMU's undocumented default ordering
            # among candidate drives. This matters now that a second IDE
            # drive (the FAT disk_image, unbootable -- no boot sector) is
            # also present: without an explicit order, SeaBIOS's choice
            # between the two is unspecified per-device bootindex
            # fallback behavior, so it can silently differ across
            # QEMU/Ubuntu runner versions and manifest as a bare "BIOS
            # never finds a bootable disk" hang -- indistinguishable from
            # a real kernel bug in the serial capture, since BIOS
            # boot-device messages go to the (disabled) VGA console, not
            # serial, and a stuck BIOS never triggers QEMU's `eof`/exit
            # (only a "waiting to boot" timeout).
            qemu_flags: -M pc -m 256M -drive file=fat:rw:./disk_image,format=raw,if=ide -serial stdio -no-reboot -display none -boot order=d

            bin_name: mitosos

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-system-x86 gcc-aarch64-linux-gnu nasm expect xorriso grub-pc-bin grub-common mtools

      - name: Setup Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: |
            x86_64-unknown-none
            aarch64-unknown-none
          components: llvm-tools-preview

      - name: Add llvm-tools to GITHUB_PATH
        run: |
          TOOLCHAIN_BIN=$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | grep host | cut -f2 -d' ')/bin
          echo "$TOOLCHAIN_BIN" >> $GITHUB_PATH

      - name: Create ramdisk (ARM only)
        if: matrix.target == 'aarch64-unknown-none'
        run: |
          mkdir -p rootfs/bin
          echo "Hello from mitosOS in-memory filesystem!" > rootfs/test.txt
          aarch64-linux-gnu-as -o test_program_aarch64.o userspace/test_program_aarch64.s
          aarch64-linux-gnu-ld -e _start -Ttext=0x8000010000 -o rootfs/bin/test_program test_program_aarch64.o
          rm -f test_program_aarch64.o
          tar -cf rootfs.tar -C rootfs bin/test_program test.txt

      - name: Build kernel (ARM only)
        if: matrix.target == 'aarch64-unknown-none'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare boot image (ARM only)
        if: matrix.target == 'aarch64-unknown-none'
        run: rust-objcopy --strip-all -O binary target/${{ matrix.target }}/release/mitosos ${{ matrix.bin_name }}

      - name: Fetch Limine (x86_64 only)
        if: matrix.target == 'x86_64-unknown-none'
        run: |
          chmod +x fetch_limine.sh
          ./fetch_limine.sh

      - name: Build kernel + Limine-bootable ISO (x86_64 only)
        if: matrix.target == 'x86_64-unknown-none'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify mitosos.iso is actually bootable (x86_64 only)
        if: matrix.target == 'x86_64-unknown-none'
        run: |
          echo "== mitosos.iso layout =="
          ls -la mitosos.iso
          echo "== ISO9660 signature (must be 'CD001' at byte 32769, the Primary Volume Descriptor) =="
          SIG=$(dd if=mitosos.iso bs=1 skip=32769 count=5 2>/dev/null)
          if [ "$SIG" != "CD001" ]; then
            echo "::error::mitosos.iso doesn't look like a real ISO9660 image -- got '$SIG' at byte 32769, expected 'CD001'"
            exit 1
          fi
          echo "== first 16 bytes (Limine's BIOS stage-2 install target) =="
          od -An -tx1 -N 16 mitosos.iso

      - name: Upload ISO
        if: matrix.target == 'x86_64-unknown-none'
        uses: actions/upload-artifact@v4
        with:
          name: mitosOS-iso
          path: mitosos.iso

      

          
      - name: Create scratch FAT disk image (x86_64 only)
        if: matrix.target == 'x86_64-unknown-none'
        run: |
          # QEMU's `fat:rw:<dir>` driver mounts an *existing* host
          # directory as a virtual FAT disk -- it never creates one
          # itself. Without this, QEMU fails at argument-parsing time
          # ("Could not read directory ./disk_image") before the
          # kernel ever runs, which the expect script then
          # misreports as "likely a triple fault" since QEMU exits
          # immediately (eof) instead of booting.
          mkdir -p disk_image

      - name: Boot in QEMU and check serial output
        run: |
          set -o pipefail
          
          if [ "${{ matrix.target }}" = "aarch64-unknown-none" ]; then
            BOOT_ARGS="-kernel kernel8.img"
            TIMEOUT_SEC=180
            KILL_SPAWNED_ON_EXIT=0
            QEMU_CMD="${{ matrix.qemu_bin }} ${{ matrix.qemu_flags }} $BOOT_ARGS"
          else
            BOOT_ARGS="-cdrom mitosos.iso"
            TIMEOUT_SEC=45
            KILL_SPAWNED_ON_EXIT=1
            # x86_64 only: outer guard in case the in-script kill below
            # ever fails to fire -- this is what actually stops a stuck
            # boot from hanging the job for 40+ minutes. Left off
            # aarch64 on purpose.
            QEMU_CMD="timeout -k 10 $((TIMEOUT_SEC + 30)) ${{ matrix.qemu_bin }} ${{ matrix.qemu_flags }} $BOOT_ARGS"
          fi

          ISOLATION_MSG="Terminating isolated task..."
          INPUT_CMD="run /bin/test_program"

          cat << 'EOF' > run_test.exp
          fconfigure stdout -buffering none
          set timeout $env(TIMEOUT_SEC)
          spawn sh -c "$env(QEMU_CMD)"

          # x86_64 only (see KILL_SPAWNED_ON_EXIT above). `exit` in
          # Expect doesn't kill a still-running spawned process, so on
          # x86_64 this also kills QEMU before exiting -- otherwise an
          # orphaned QEMU keeps the `tee` pipe below open and the step
          # hangs. aarch64 keeps the original bare `exit`, untouched.
          proc bail {code} {
              global env
              if {$env(KILL_SPAWNED_ON_EXIT) eq "1"} {
                  catch {exec kill -9 [exp_pid -i $::spawn_id]}
              }
              exit $code
          }

          expect {
              "mitosOS: kernel_main reached. Boot OK." { 
                  puts "\n> CI: Boot confirmed! Waiting 2 seconds for shell..."
                  sleep 2
              }
              eof {
                  puts "\n> CI: Error: QEMU exited unexpectedly (likely a triple fault)!"
                  bail 1
              }
              timeout {
                  puts "\n> CI: Error: Timed out waiting for kernel to boot."
                  bail 1
              }
          }
          
          set send_slow {1 .05}
          send -s "$env(INPUT_CMD)\r"

          set got_isolation 0
          set got_prompt 0

          expect {
              "$env(ISOLATION_MSG)" {
                  set got_isolation 1
                  puts "\n> CI: User-mode fault successfully isolated."
                  if {!$got_prompt} { exp_continue }
              }
              "mitosOS>" {
                  set got_prompt 1
                  puts "\n> CI: Shell prompt seen."
                  if {!$got_isolation} { exp_continue }
              }
              eof {
                  puts "\n> CI: Error: QEMU crashed or exited unexpectedly!"
                  bail 1
              }
              timeout {
                  if {!$got_isolation} {
                      puts "\n> CI: Error: Timed out waiting for task termination message."
                  } else {
                      puts "\n> CI: Error: Shell did not return after fault. OS likely hung."
                  }
                  bail 1
              }
          }

          puts "\n> CI: Shell survived the fault! Test passed."
          sleep 1
          bail 0
          EOF

          export QEMU_CMD
          export TIMEOUT_SEC
          export INPUT_CMD
          export ISOLATION_MSG
          export KILL_SPAWNED_ON_EXIT

          expect run_test.exp 2>&1 | tee qemu_output.log || true

          echo "----- captured serial output -----"
          cat qemu_output.log
          
          grep -q "mitosOS: kernel_main reached. Boot OK." qemu_output.log
          grep -q "$ISOLATION_MSG" qemu_output.log
          grep -q "mitosOS>" qemu_output.log

      - name: Build GRUB Multiboot2 ISO (x86_64 only, bypasses Limine entirely)
        if: "!cancelled() && matrix.target == 'x86_64-unknown-none'"
        run: |
          # Same kernel ELF + ramdisk as mitosos.iso, but boots via GRUB's
          # real Multiboot2 loader instead of Limine. Purely a diagnostic:
          # if THIS boots but mitosos.iso doesn't, the bug is specific to
          # Limine (its config parsing, its ELF loading, its module
          # handling, ...). If THIS also hangs, the bug is in kernel code
          # shared by both paths (boot_multiboot2.s onward, or later).
          #
          # NOTE: deliberately GRUB, not QEMU's own `-kernel` flag -- QEMU's
          # built-in multiboot loader only understands Multiboot v1 (magic
          # 0x1BADB002), never Multiboot2 (0xe85250d6, what this kernel's
          # header actually uses), so `-kernel mitosos.elf` would just fail
          # to find a header it recognises rather than testing anything.
          mkdir -p grub_iso/boot/grub
          cp iso_root/boot/mitosos.elf grub_iso/boot/mitosos.elf
          cp iso_root/boot/rootfs.tar grub_iso/boot/rootfs.tar
          cat << 'EOF' > grub_iso/boot/grub/grub.cfg
          set timeout=0
          set default=0
          serial --unit=0 --speed=115200
          terminal_input console serial
          terminal_output console serial

          menuentry "mitosOS (Multiboot2 via GRUB, no Limine)" {
              multiboot2 /boot/mitosos.elf
              module2 /boot/rootfs.tar
              boot
          }
          EOF
          grub-mkrescue -o mitosos-grub.iso grub_iso

      - name: Boot test via GRUB Multiboot2 (x86_64 only, bypasses Limine)
        if: "!cancelled() && matrix.target == 'x86_64-unknown-none'"
        run: |
          set -o pipefail

          QEMU_CMD="timeout -k 10 40 qemu-system-x86_64 -M pc -m 256M -no-reboot -display none -serial stdio -boot order=d,menu=off -cdrom mitosos-grub.iso"

          cat << 'EOF' > run_test_grub.exp
          fconfigure stdout -buffering none
          set timeout 35
          spawn sh -c "$env(QEMU_CMD)"

          proc bail {code} {
              catch {exec kill -9 [exp_pid -i $::spawn_id]}
              exit $code
          }

          expect {
              "mitosOS: kernel_main reached. Boot OK." {
                  puts "\n> CI: Multiboot2/GRUB boot confirmed! Waiting 2 seconds for shell..."
                  sleep 2
              }
              eof {
                  puts "\n> CI: Error: QEMU exited unexpectedly (likely a triple fault)!"
                  bail 1
              }
              timeout {
                  puts "\n> CI: Error: Timed out waiting for kernel to boot via GRUB/Multiboot2."
                  bail 1
              }
          }

          set send_slow {1 .05}
          send -s "run /bin/test_program\r"

          set got_isolation 0
          set got_prompt 0

          expect {
              "Terminating isolated task..." {
                  set got_isolation 1
                  puts "\n> CI: User-mode fault successfully isolated."
                  if {!$got_prompt} { exp_continue }
              }
              "mitosOS>" {
                  set got_prompt 1
                  puts "\n> CI: Shell prompt seen."
                  if {!$got_isolation} { exp_continue }
              }
              eof {
                  puts "\n> CI: Error: QEMU crashed or exited unexpectedly!"
                  bail 1
              }
              timeout {
                  if {!$got_isolation} {
                      puts "\n> CI: Error: Timed out waiting for task termination message."
                  } else {
                      puts "\n> CI: Error: Shell did not return after fault. OS likely hung."
                  }
                  bail 1
              }
          }

          puts "\n> CI: Shell survived the fault via GRUB/Multiboot2 boot too! Test passed."
          sleep 1
          bail 0
          EOF

          export QEMU_CMD

          expect run_test_grub.exp 2>&1 | tee qemu_output_grub.log || true

          echo "----- captured GRUB/Multiboot2 serial output -----"
          cat qemu_output_grub.log

          grep -q "mitosOS: kernel_main reached. Boot OK." qemu_output_grub.log
          grep -q "Terminating isolated task..." qemu_output_grub.log
          grep -q "mitosOS>" qemu_output_grub.log

      

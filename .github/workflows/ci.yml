name: kernel-boot-test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-none
            qemu_bin: qemu-system-aarch64
            qemu_flags: -M raspi3b -display none -serial stdio
            bin_name: kernel8.img

          - target: x86_64-unknown-none
            qemu_bin: qemu-system-x86_64
            # Boots disk.img via SeaBIOS — exercises the real
            # stage1 -> stage2 -> kernel handoff, not a shortcut load.
            qemu_flags: -M pc -m 256M -no-reboot -display none -serial stdio

            bin_name: mitosos

  
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-system-x86 gcc-aarch64-linux-gnu nasm expect

      - name: Setup Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none, aarch64-unknown-none
          components: llvm-tools-preview

      - name: Create ramdisk (ARM only)
        if: matrix.target == 'aarch64-unknown-none'
        run: |
          mkdir -p rootfs/bin
          echo "Hello from mitosOS in-memory filesystem!" > rootfs/test.txt
          aarch64-linux-gnu-as -o test_program_aarch64.o userspace/test_program_aarch64.s
          # -Ttext places _start at memory::USER_SPACE_BASE (0x8000000000)
          # + 0x10000, matching build.sh's x86_64 link step -- elf.rs
          # refuses to load anything below USER_SPACE_BASE now.
          aarch64-linux-gnu-ld -e _start -Ttext=0x8000010000 -o rootfs/bin/test_program test_program_aarch64.o
          rm -f test_program_aarch64.o
          tar -cf rootfs.tar -C rootfs bin/test_program test.txt

      - name: Build kernel (ARM only)
        if: matrix.target == 'aarch64-unknown-none'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare boot image (ARM only)
        if: matrix.target == 'aarch64-unknown-none'
        run: |
          TOOLCHAIN_BIN=$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | grep host | cut -f2 -d' ')/bin
          export PATH=$PATH:$TOOLCHAIN_BIN
          rust-objcopy --strip-all -O binary target/${{ matrix.target }}/release/mitosos ${{ matrix.bin_name }}

      - name: Build bootloader + kernel + disk image (x86_64 only)
        if: matrix.target == 'x86_64-unknown-none'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Boot in QEMU and check serial output
        run: |
          set -o pipefail
          
          # 1. Define architecture-specific variables
          if [ "${{ matrix.target }}" = "aarch64-unknown-none" ]; then
            BOOT_ARGS="-kernel kernel8.img"
            TIMEOUT_SEC=180
            CRASH_MSG="Trapped MSR/MRS/System instruction"
          else
            BOOT_ARGS="-drive format=raw,file=disk.img,if=ide -device ahci,id=ahci0"
            TIMEOUT_SEC=45
            CRASH_MSG="General Protection Fault"
          fi

          # 2. Combine the full QEMU command and target command
          QEMU_CMD="${{ matrix.qemu_bin }} ${{ matrix.qemu_flags }} $BOOT_ARGS"
          INPUT_CMD="run /bin/test_program"

          # 3. Create the Expect script dynamically
          cat << 'EOF' > run_test.exp
          # Set the overall timeout for the script
          set timeout $env(TIMEOUT_SEC)
          
          # Start QEMU through a shell to safely handle spaces in arguments
          spawn sh -c "$env(QEMU_CMD)"
          
          # Stage A: Wait for the kernel to finish booting
          expect {
              "mitosOS: kernel_main reached. Boot OK." { 
                  puts "\n[CI] Boot confirmed! Waiting 2 seconds for shell..."
                  sleep 2
              }
              timeout {
                  puts "\n[CI] Error: Timed out waiting for kernel to boot."
                  exit 1
              }
          }
          
          # Stage B: Type the command slowly to prevent UART FIFO drops
          set send_slow {1 .05}
          send -s "$env(INPUT_CMD)\r"
          
          # Stage C: Wait for the process to run and trigger the expected fault
          expect {
              "$env(CRASH_MSG)" { 
                  puts "\n[CI] Expected fault detected! Test passed."
                  sleep 1
                  exit 0 
              }
              timeout {
                  puts "\n[CI] Error: Timed out waiting for ring-3 fault."
                  exit 1
              }
          }
          EOF

          # 4. Export variables so Expect can read them
          export QEMU_CMD
          export TIMEOUT_SEC
          export INPUT_CMD
          export CRASH_MSG

          # 5. Run Expect and capture the output
          expect run_test.exp 2>&1 | tee qemu_output.log

          # 6. Final strict assertions (re-verifying via grep to match your original check)
          echo "----- captured serial output -----"
          cat qemu_output.log
          
          grep -q "mitosOS: kernel_main reached. Boot OK." qemu_output.log
          grep -q "Spawned as a new isolated (ring-3) process" qemu_output.log
          if [ "${{ matrix.target }}" = "aarch64-unknown-none" ]; then
            grep -q "Trapped MSR/MRS/System instruction" qemu_output.log
          else
            grep -q "General Protection Fault" qemu_output.log
          fi

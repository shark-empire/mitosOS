[package]
name = "mitosos"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mitosos"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
strip = false
debug = true


[dependencies]
spin = "0.9"

# Your kernel dependencies go here (e.g., spin, bitflags, x86_64 crates)

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15.2"
limine = "0.9.0"
# Limine + Multiboot2 boot support (src/limine.rs, src/boot_multiboot2.s,
# src/boot_info.rs) is hand-written directly against limine-protocol's
# PROTOCOL.md and the Multiboot2 spec rather than an external crate, so
# it adds no new dependency here.

[target.'cfg(target_arch = "aarch64")'.dependencies]
# Your AArch64 dependencies

[build-dependencies]
# Used by build.rs for aarch64's boot.s only -- x86_64's boot_x86.s and
# boot_multiboot2.s are assembled by shelling out to nasm directly
# instead (see build.rs's file header for why).
cc = "1.0"
